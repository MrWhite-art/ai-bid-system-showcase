<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>线框 — 登录</title>
<link rel="stylesheet" href="shell.css">
<style>
  /* 登录页：整屏两栏，无侧边栏 */
  .login-wrap { display: flex; min-height: 100vh; }
  .brand-panel { width: 55%; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 20px; background: linear-gradient(135deg, #334155 0%, #64748b 100%); }
  .brand-title { font-size: 26px; font-weight: bold; color: #f8fafc; }
  .brand-slogan { width: 60%; padding: 10px 16px; border: 1px dashed #cbd5e1; border-radius: 4px; color: #e2e8f0; text-align: center; }
  .login-panel { width: 45%; display: flex; justify-content: center; align-items: center; background: #ffffff; }
  .login-card { width: 300px; display: flex; flex-direction: column; gap: 14px; }
  .login-head { font-size: 18px; font-weight: bold; color: #334155; }
  .login-input { height: 36px; padding: 0 10px; display: flex; align-items: center; border: 1px dashed #94a3b8; border-radius: 4px; background: #f1f5f9; color: #94a3b8; font-size: 12px; }
  .login-btn { height: 36px; display: flex; align-items: center; justify-content: center; border: 1px solid #475569; border-radius: 4px; background: #475569; color: #f8fafc; font-size: 13px; cursor: pointer; }
  .login-tip { font-size: 12px; color: #94a3b8; text-align: center; }
</style>
</head>
<body>
  <div class="login-wrap">
    <div class="brand-panel">
      <div class="brand-title">AI 标书系统</div>
      <div class="brand-slogan">标语占位：让投标更简单、更精准</div>
    </div>
    <div class="login-panel">
      <div class="login-card">
        <div class="login-head">登录</div>
        <div class="login-input">账号占位：请输入账号</div>
        <div class="login-input">密码占位：请输入密码</div>
        <button class="login-btn" type="button">进入系统</button>
        <div class="login-tip">演示：点击「进入系统」进入驾驶舱</div>
      </div>
    </div>
  </div>
  <script>
    document.querySelector('.login-btn').addEventListener('click', function () {
      window.location.href = '02-dashboard.html';
    });
  </script>
</body>
</html>
